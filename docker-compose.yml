name: xauusd-ai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - xau-ai-network

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - xau-ai-network

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v DATABASE_APP_PASSWORD="$$DATABASE_APP_PASSWORD"
        -i /scripts/initialize-database.sql
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD in the ignored .env file}
    volumes:
      - ./scripts/sql:/scripts:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - xau-ai-network

  database-migrator:
    build:
      context: .
      dockerfile: backend/XauAi.Api/Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      APP_NAME: ${APP_NAME:-XAUUSD-AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_STRING: "Server=sqlserver,1433;Database=XauAi;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-30}
      DATABASE_APPLY_MIGRATIONS_ON_STARTUP: "true"
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - xau-ai-network

  api:
    build:
      context: .
      dockerfile: backend/XauAi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      APP_NAME: ${APP_NAME:-XAUUSD-AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL_DEFAULT: ${LOG_LEVEL_DEFAULT:-Information}
      API_ENABLE_SWAGGER: ${API_ENABLE_SWAGGER:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      DATABASE_CONNECTION_STRING: "Server=sqlserver,1433;Database=XauAi;User Id=xauai_app;Password=${DATABASE_APP_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-30}
      DATABASE_APPLY_MIGRATIONS_ON_STARTUP: "false"
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis:6379}
      REDIS_INSTANCE_NAME: ${REDIS_INSTANCE_NAME:-XauAi:}
      REDIS_DEFAULT_EXPIRATION_SECONDS: ${REDIS_DEFAULT_EXPIRATION_SECONDS:-300}
      AI_INTERPRETATION_PROMPT_VERSION: ${AI_INTERPRETATION_PROMPT_VERSION:-phase11-v2}
      AI_INTERPRETATION_DEFAULT_LOOKBACK_HOURS: ${AI_INTERPRETATION_DEFAULT_LOOKBACK_HOURS:-168}
      AI_INTERPRETATION_MAXIMUM_LOOKBACK_HOURS: ${AI_INTERPRETATION_MAXIMUM_LOOKBACK_HOURS:-17520}
      AI_INTERPRETATION_MAXIMUM_EVIDENCE_ITEMS: ${AI_INTERPRETATION_MAXIMUM_EVIDENCE_ITEMS:-60}
      AI_INTERPRETATION_MAXIMUM_COMPRESSED_CHARACTERS: ${AI_INTERPRETATION_MAXIMUM_COMPRESSED_CHARACTERS:-24000}
      AI_INTERPRETATION_CURRENT_CONTEXT_CACHE_MINUTES: ${AI_INTERPRETATION_CURRENT_CONTEXT_CACHE_MINUTES:-5}
      AI_INTERPRETATION_MAXIMUM_PAGE_SIZE: ${AI_INTERPRETATION_MAXIMUM_PAGE_SIZE:-200}
      NEWS_AI_ENABLED: ${NEWS_AI_ENABLED:-false}
      NEWS_AI_PROVIDER: ${NEWS_AI_PROVIDER:-None}
      NEWS_AI_ADAPTER: ${NEWS_AI_ADAPTER:-OpenAiCompatible}
