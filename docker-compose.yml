name: xauusd-ai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - xau-ai-network

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - xau-ai-network

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v DATABASE_APP_PASSWORD="$$DATABASE_APP_PASSWORD"
        -i /scripts/initialize-database.sql
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD in the ignored .env file}
    volumes:
      - ./scripts/sql:/scripts:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - xau-ai-network

  database-migrator:
    build:
      context: .
      dockerfile: backend/XauAi.Api/Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      APP_NAME: ${APP_NAME:-XAUUSD-AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_STRING: "Server=sqlserver,1433;Database=XauAi;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-30}
      DATABASE_APPLY_MIGRATIONS_ON_STARTUP: "true"
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - xau-ai-network

  api:
    build:
      context: .
      dockerfile: backend/XauAi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      APP_NAME: ${APP_NAME:-XAUUSD-AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL_DEFAULT: ${LOG_LEVEL_DEFAULT:-Information}
      API_ENABLE_SWAGGER: ${API_ENABLE_SWAGGER:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      DATABASE_CONNECTION_STRING: "Server=sqlserver,1433;Database=XauAi;User Id=xauai_app;Password=${DATABASE_APP_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-30}
      DATABASE_APPLY_MIGRATIONS_ON_STARTUP: "false"
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis:6379}
      REDIS_INSTANCE_NAME: ${REDIS_INSTANCE_NAME:-XauAi:}
      REDIS_DEFAULT_EXPIRATION_SECONDS: ${REDIS_DEFAULT_EXPIRATION_SECONDS:-300}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-None}
      AI_REQUIRES_API_KEY: ${AI_REQUIRES_API_KEY:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-0}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-0}
      MT5_ENABLED: ${MT5_ENABLED:-false}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_TERMINAL_PATH: ${MT5_TERMINAL_PATH:-}
      MT5_APPLICATION_SYMBOL: ${MT5_APPLICATION_SYMBOL:-XAUUSD}
      MT5_SYMBOL: ${MT5_SYMBOL:-XAUUSD}
      MT5_TIMEZONE: ${MT5_TIMEZONE:-UTC}
      MT5_CONNECTION_TIMEOUT_SECONDS: ${MT5_CONNECTION_TIMEOUT_SECONDS:-30}
      MT5_REQUEST_TIMEOUT_SECONDS: ${MT5_REQUEST_TIMEOUT_SECONDS:-60}
      MT5_RECONNECT_DELAY_SECONDS: ${MT5_RECONNECT_DELAY_SECONDS:-5}
      MT5_MAX_BARS_PER_REQUEST: ${MT5_MAX_BARS_PER_REQUEST:-10000}
      MT5_PYTHON_EXECUTABLE: ${MT5_PYTHON_EXECUTABLE:-py}
      MT5_BRIDGE_SCRIPT_PATH: ${MT5_BRIDGE_SCRIPT_PATH:-}
      MARKET_DATA_SYNC_ENABLED: ${MARKET_DATA_SYNC_ENABLED:-false}
      MARKET_DATA_SYMBOL: ${MARKET_DATA_SYMBOL:-XAUUSD}
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-M1,M5,M15,M30,H1,H4,D1}
      MARKET_DATA_INITIAL_HISTORY_DAYS: ${MARKET_DATA_INITIAL_HISTORY_DAYS:-7}
      MARKET_DATA_SYNC_INTERVAL_SECONDS: ${MARKET_DATA_SYNC_INTERVAL_SECONDS:-10}
      MARKET_DATA_BATCH_SIZE: ${MARKET_DATA_BATCH_SIZE:-1000}
      MARKET_DATA_MAX_API_LIMIT: ${MARKET_DATA_MAX_API_LIMIT:-5000}
      MARKET_DATA_MAX_QUERY_RANGE_DAYS: ${MARKET_DATA_MAX_QUERY_RANGE_DAYS:-366}
      MARKET_DATA_MAX_RETRIES: ${MARKET_DATA_MAX_RETRIES:-2}
      MARKET_DATA_RETRY_BASE_DELAY_SECONDS: ${MARKET_DATA_RETRY_BASE_DELAY_SECONDS:-2}
      MARKET_DATA_MAX_GAP_RESULTS: ${MARKET_DATA_MAX_GAP_RESULTS:-1000}
      MARKET_DATA_INCLUDE_FORMING_CANDLE: ${MARKET_DATA_INCLUDE_FORMING_CANDLE:-true}
      TECHNICAL_ANALYSIS_ENABLED: ${TECHNICAL_ANALYSIS_ENABLED:-false}
      TECHNICAL_ANALYSIS_SYMBOL: ${TECHNICAL_ANALYSIS_SYMBOL:-XAUUSD}
      TECHNICAL_ANALYSIS_TIMEFRAMES: ${TECHNICAL_ANALYSIS_TIMEFRAMES:-M1,M5,M15,M30,H1,H4,D1}
      TECHNICAL_ANALYSIS_HISTORY_LIMIT: ${TECHNICAL_ANALYSIS_HISTORY_LIMIT:-1000}
      SMA_PERIODS: ${SMA_PERIODS:-20,50,200}
      EMA_PERIODS: ${EMA_PERIODS:-9,20,50,100,200}
      RSI_PERIOD: ${RSI_PERIOD:-14}
      MACD_FAST_PERIOD: ${MACD_FAST_PERIOD:-12}
      MACD_SLOW_PERIOD: ${MACD_SLOW_PERIOD:-26}
      MACD_SIGNAL_PERIOD: ${MACD_SIGNAL_PERIOD:-9}
      ATR_PERIOD: ${ATR_PERIOD:-14}
      ADX_PERIOD: ${ADX_PERIOD:-14}
      BOLLINGER_PERIOD: ${BOLLINGER_PERIOD:-20}
      BOLLINGER_STANDARD_DEVIATION: ${BOLLINGER_STANDARD_DEVIATION:-2}
      STOCHASTIC_K_PERIOD: ${STOCHASTIC_K_PERIOD:-14}
      STOCHASTIC_D_PERIOD: ${STOCHASTIC_D_PERIOD:-3}
      SWING_WINDOW: ${SWING_WINDOW:-2}
      LEVEL_TOLERANCE_PERCENT: ${LEVEL_TOLERANCE_PERCENT:-0.15}
      MINIMUM_LEVEL_TOUCHES: ${MINIMUM_LEVEL_TOUCHES:-2}
      MAXIMUM_LEVEL_ZONES: ${MAXIMUM_LEVEL_ZONES:-8}
      PRICE_ACTION_LOOKBACK: ${PRICE_ACTION_LOOKBACK:-20}
      VOLATILITY_LOOKBACK: ${VOLATILITY_LOOKBACK:-50}
      VERY_LOW_VOLATILITY_RATIO: ${VERY_LOW_VOLATILITY_RATIO:-0.60}
      LOW_VOLATILITY_RATIO: ${LOW_VOLATILITY_RATIO:-0.80}
      HIGH_VOLATILITY_RATIO: ${HIGH_VOLATILITY_RATIO:-1.20}
      VERY_HIGH_VOLATILITY_RATIO: ${VERY_HIGH_VOLATILITY_RATIO:-1.50}
      NEWS_ENABLED: ${NEWS_ENABLED:-false}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-None}
      NEWS_REQUIRES_API_KEY: ${NEWS_REQUIRES_API_KEY:-true}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_BASE_URL: ${NEWS_BASE_URL:-}
      NEWS_TIMEOUT_SECONDS: ${NEWS_TIMEOUT_SECONDS:-30}
      NEWS_MAX_RETRIES: ${NEWS_MAX_RETRIES:-2}
      NEWS_RATE_LIMIT_PER_MINUTE: ${NEWS_RATE_LIMIT_PER_MINUTE:-0}
      NEWS_USE_TIMEFRAME_PARAMETER: ${NEWS_USE_TIMEFRAME_PARAMETER:-false}
      NEWS_PROVIDER_KEY: ${NEWS_PROVIDER_KEY:-newsdata}
      NEWS_SYMBOL: ${NEWS_SYMBOL:-XAUUSD}
      NEWS_LANGUAGE: ${NEWS_LANGUAGE:-en}
      NEWS_PROVIDER_QUERY: ${NEWS_PROVIDER_QUERY:-gold OR bullion OR XAUUSD OR Federal Reserve OR FOMC OR inflation OR CPI OR NFP OR USD}
      NEWS_INITIAL_LOOKBACK_HOURS: ${NEWS_INITIAL_LOOKBACK_HOURS:-24}
      NEWS_COLLECTION_OVERLAP_MINUTES: ${NEWS_COLLECTION_OVERLAP_MINUTES:-10}
      NEWS_COLLECTION_INTERVAL_SECONDS: ${NEWS_COLLECTION_INTERVAL_SECONDS:-900}
      NEWS_PAGE_SIZE: ${NEWS_PAGE_SIZE:-10}
      NEWS_MAXIMUM_PAGES_PER_COLLECTION: ${NEWS_MAXIMUM_PAGES_PER_COLLECTION:-3}
      NEWS_MAXIMUM_PAGE_SIZE: ${NEWS_MAXIMUM_PAGE_SIZE:-100}
      NEWS_MAXIMUM_COLLECTION_RANGE_DAYS: ${NEWS_MAXIMUM_COLLECTION_RANGE_DAYS:-31}
      NEWS_RETRY_BASE_DELAY_SECONDS: ${NEWS_RETRY_BASE_DELAY_SECONDS:-2}
      NEWS_ARCHIVE_ENABLED: ${NEWS_ARCHIVE_ENABLED:-false}
      NEWS_MINIMUM_RELEVANCE: ${NEWS_MINIMUM_RELEVANCE:-Medium}
      NEWS_GOLD_KEYWORDS: ${NEWS_GOLD_KEYWORDS:-gold,bullion,precious metal,xau,xauusd}
      NEWS_USD_KEYWORDS: ${NEWS_USD_KEYWORDS:-us dollar,usd,dxy,dollar index,greenback}
      NEWS_FED_KEYWORDS: ${NEWS_FED_KEYWORDS:-federal reserve,fomc,jerome powell,powell,fed chair}
      NEWS_INFLATION_KEYWORDS: ${NEWS_INFLATION_KEYWORDS:-inflation,consumer price index,cpi,personal consumption expenditures,pce}
      NEWS_EMPLOYMENT_KEYWORDS: ${NEWS_EMPLOYMENT_KEYWORDS:-nonfarm payroll,non-farm payroll,nfp,jobs report,unemployment,jobless claims}
      NEWS_RATES_KEYWORDS: ${NEWS_RATES_KEYWORDS:-interest rate,rate cut,rate hike,treasury yield,bond yield,real yield}
      NEWS_ECONOMY_KEYWORDS: ${NEWS_ECONOMY_KEYWORDS:-us economy,gdp,economic growth,recession,retail sales,ism,consumer confidence}
      NEWS_CENTRAL_BANK_KEYWORDS: ${NEWS_CENTRAL_BANK_KEYWORDS:-central bank,ecb,bank of japan,boj,bank of england,pboc}
      NEWS_GEOPOLITICS_KEYWORDS: ${NEWS_GEOPOLITICS_KEYWORDS:-geopolitical,sanctions,war,conflict,ceasefire,trade tensions,safe haven}
      NEWS_COMMODITY_KEYWORDS: ${NEWS_COMMODITY_KEYWORDS:-commodity,commodities,silver,oil price,energy market}
      ECONOMIC_DATA_ENABLED: ${ECONOMIC_DATA_ENABLED:-false}
      ECONOMIC_DATA_PROVIDER: ${ECONOMIC_DATA_PROVIDER:-None}
      ECONOMIC_DATA_PROVIDER_KEY: ${ECONOMIC_DATA_PROVIDER_KEY:-fred}
      ECONOMIC_DATA_REQUIRES_API_KEY: ${ECONOMIC_DATA_REQUIRES_API_KEY:-true}
      FRED_API_KEY: ${FRED_API_KEY:-}
      ECONOMIC_DATA_BASE_URL: ${ECONOMIC_DATA_BASE_URL:-https://api.stlouisfed.org/fred/}
      ECONOMIC_DATA_TIMEOUT_SECONDS: ${ECONOMIC_DATA_TIMEOUT_SECONDS:-30}
      ECONOMIC_DATA_MAX_RETRIES: ${ECONOMIC_DATA_MAX_RETRIES:-2}
      ECONOMIC_DATA_RATE_LIMIT_PER_MINUTE: ${ECONOMIC_DATA_RATE_LIMIT_PER_MINUTE:-100}
      ECONOMIC_DATA_INITIAL_HISTORY_YEARS: ${ECONOMIC_DATA_INITIAL_HISTORY_YEARS:-20}
      ECONOMIC_DATA_REVISION_LOOKBACK_DAYS: ${ECONOMIC_DATA_REVISION_LOOKBACK_DAYS:-370}
      ECONOMIC_DATA_SYNC_INTERVAL_MINUTES: ${ECONOMIC_DATA_SYNC_INTERVAL_MINUTES:-360}
      ECONOMIC_DATA_PROVIDER_PAGE_SIZE: ${ECONOMIC_DATA_PROVIDER_PAGE_SIZE:-1000}
      ECONOMIC_DATA_MAXIMUM_PAGES_PER_SERIES: ${ECONOMIC_DATA_MAXIMUM_PAGES_PER_SERIES:-100}
      ECONOMIC_DATA_MAXIMUM_PAGE_SIZE: ${ECONOMIC_DATA_MAXIMUM_PAGE_SIZE:-500}
      ECONOMIC_DATA_MAXIMUM_QUERY_RANGE_YEARS: ${ECONOMIC_DATA_MAXIMUM_QUERY_RANGE_YEARS:-100}
      ECONOMIC_DATA_RETRY_BASE_DELAY_SECONDS: ${ECONOMIC_DATA_RETRY_BASE_DELAY_SECONDS:-2}
      ECONOMIC_DATA_TRACKED_SERIES: ${ECONOMIC_DATA_TRACKED_SERIES:-CPIAUCSL:Inflation,CPILFESL:Inflation,PCEPI:Inflation,PCEPILFE:Inflation,UNRATE:Employment,PAYEMS:Employment,FEDFUNDS:InterestRates,DGS2:Treasury,DGS5:Treasury,DGS10:Treasury,DGS30:Treasury,GDP:EconomicGrowth,GDPC1:EconomicGrowth,RSAFS:Consumer,INDPRO:Production,UMCSENT:Consumer}
      ANALYSTS_ENABLED: ${ANALYSTS_ENABLED:-false}
      ANALYST_PROVIDER: ${ANALYST_PROVIDER:-None}
      ANALYST_SOURCE_TYPE: ${ANALYST_SOURCE_TYPE:-Manual}
      ANALYST_REQUIRES_API_KEY: ${ANALYST_REQUIRES_API_KEY:-false}
      ANALYST_PROVIDER_API_KEY: ${ANALYST_PROVIDER_API_KEY:-}
      ANALYST_BASE_URL: ${ANALYST_BASE_URL:-}
      ANALYST_TIMEOUT_SECONDS: ${ANALYST_TIMEOUT_SECONDS:-30}
      ANALYST_MAX_RETRIES: ${ANALYST_MAX_RETRIES:-2}
      ANALYST_RATE_LIMIT_PER_MINUTE: ${ANALYST_RATE_LIMIT_PER_MINUTE:-0}
    ports:
      - "${API_PORT:-5081}:8080"
    depends_on:
      database-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - xau-ai-network

  web:
    build:
      context: .
      dockerfile: frontend/xau-ai-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5081}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - xau-ai-network

networks:
  xau-ai-network:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
